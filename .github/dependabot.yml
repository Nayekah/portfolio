version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      vite-stack:
        dependency-type: "development"
        patterns:
          - "vite"
          - "@vitejs/*"
      eslint-stack:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
